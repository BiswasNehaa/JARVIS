<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <script>
    // Single continuous white waveform line, transparent canvas — no 3D scene,
    // no particles, no fill. Reads as one flowing line, like an audio waveform
    // graphic. State changes shape/motion (amplitude, frequency, how many
    // "bursts" of activity), not color.

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    let W = 0, H = 0;

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      W = canvas.clientWidth; H = canvas.clientHeight;
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resize);
    resize();

    function lerp(t, a, b) { return a + t * (b - a); }
    function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }

    // sum of Gaussian "bursts" positioned across the line — this is what gives
    // the reference its look: dense tall oscillation in a couple of places,
    // tapering to a near-flat line elsewhere, instead of one uniform sine wave.
    function envelope(u, t, humps) {
      let e = 0;
      for (let i = 0; i < humps; i++) {
        const spread = humps === 1 ? 0 : 0.56 / (humps - 1);
        const center = (humps === 1 ? 0.5 : 0.22 + i * spread) + 0.03 * Math.sin(t * 0.25 + i * 2.1);
        const sigma = 0.11 + 0.015 * Math.sin(t * 0.2 + i);
        const d = (u - center) / sigma;
        e += Math.exp(-d * d);
      }
      return Math.min(1, e);
    }

    // ---------- state machine ----------
    // burst = overall amplitude, freq = oscillations per line, speed = how fast
    // the wave travels/breathes, humps = how many bursts of activity along the line.
    const STATE_TARGETS = {
      IDLE:       { burst: 0.32, freq: 13, speed: 0.35, bright: 0.8,  humps: 1 },
      ACTIVATING: { burst: 0.55, freq: 15, speed: 0.8,  bright: 1.0,  humps: 1 },
      LISTENING:  { burst: 0.4,  freq: 14, speed: 0.5,  bright: 0.9,  humps: 1 },
      PROCESSING: { burst: 0.8,  freq: 21, speed: 1.5,  bright: 1.05, humps: 3 },
      SPEAKING:   { burst: 0.7,  freq: 19, speed: 1.1,  bright: 1.0,  humps: 2 },
      ERROR:      { burst: 0.85, freq: 25, speed: 1.9,  bright: 0.95, humps: 2 },
      SLEEPING:   { burst: 0.06, freq: 7,  speed: 0.12, bright: 0.3,  humps: 1 },
    };
    let currentState = 'IDLE';
    let audioLevel = 0;
    const p = { ...STATE_TARGETS.IDLE };

    const POINTS = 260;

    function draw(t, dt) {
      ctx.clearRect(0, 0, W, H);

      const target = STATE_TARGETS[currentState];
      const EASE = 1 - Math.pow(0.001, dt);
      for (const k in target) p[k] = lerp(EASE, p[k], target[k]);

      let bright = p.bright;
      if (currentState === 'ERROR') bright *= 0.55 + 0.45 * Math.random();

      const humps = Math.round(p.humps);
      const wt = t * p.speed;
      const midY = H * 0.5;
      const ampMax = H * 0.34 * (p.burst + audioLevel * 0.55);

      ctx.beginPath();
      for (let i = 0; i <= POINTS; i++) {
        const u = i / POINTS;
        const x = u * W;
        const env = envelope(u, wt, humps);
        const wave = Math.sin(u * Math.PI * 2 * p.freq + wt * 3);
        const y = midY + wave * env * ampMax;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }

      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.lineWidth = 2.5;
      ctx.shadowColor = 'rgba(255,255,255,0.55)';
      ctx.shadowBlur = 7 * bright;
      ctx.strokeStyle = `rgba(255,255,255,${clamp01(bright)})`;
      ctx.stroke();
    }

    let last = performance.now();
    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      draw(now / 1000, dt);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    window.setState = function (state) { if (STATE_TARGETS[state]) currentState = state; };
    window.setAudioLevel = function (level) { audioLevel = Math.max(0, Math.min(1, level)); };
    window.demoCycle = function () {
      const seq = ['IDLE', 'LISTENING', 'PROCESSING', 'SPEAKING', 'IDLE'];
      let i = 0;
      setInterval(() => { window.setState(seq[i % seq.length]); i++; }, 4000);
    };
  </script>
</body>
</html>
